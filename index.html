<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Радио-Т</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#f5f5f5;font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:120px}header{position:sticky;top:0;z-index:3;background:#111318ef;border-bottom:1px solid #292d35;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px)}h1{font-size:21px;margin:0}.sub{color:#9ca3af;font-size:13px}.wrap{max-width:820px;margin:auto;padding:22px 16px}.search{display:flex;gap:10px;margin:8px 0 20px;flex-wrap:wrap}.search input{min-width:220px}.btn:disabled{opacity:.65;cursor:default}.btn.download.saved{background:#183c2b;border-color:#2d6a4f;color:#b9f6d2}.btn.subtle{background:#171a20;color:#c7cbd1;border:1px solid #30343d}.search input{flex:1;background:#171a20;border:1px solid #30343d;color:white;border-radius:13px;padding:13px 15px;font-size:16px}.btn{border:0;border-radius:12px;background:#ff7a18;color:#151515;font-weight:700;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.download{background:#242932;color:#f5f5f5;border:1px solid #3a414d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.episode{background:#15181e;border:1px solid #272b33;border-radius:16px;padding:16px;margin:10px 0}.episode h2{font-size:18px;margin:0 0 6px}.meta{color:#9ca3af;font-size:13px;margin-bottom:10px}.desc{color:#c7cbd1;font-size:14px}.player{position:fixed;left:0;right:0;bottom:0;background:#111318f5;border-top:1px solid #30343d;padding:12px 14px;backdrop-filter:blur(14px)}.player-inner{max-width:820px;margin:auto}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.controls{display:flex;align-items:center;gap:10px}.controls button{min-width:54px}.controls input{flex:1}.speed{background:#20242b;color:white;border:1px solid #353a44;border-radius:10px;padding:8px}.status{color:#9ca3af;padding:14px 0}.error{color:#ff9d9d}.source{font-size:12px;color:#6b7280;margin-top:6px}
</style>
</head>
<body>
<header><div><h1>Радио-Т</h1><div class="sub">неофициальный веб-плеер</div></div><a href="https://radio-t.com/" target="_blank" rel="noreferrer" style="color:#ff7a18">radio-t.com ↗</a></header>
<main class="wrap">
<div class="search"><input id="q" placeholder="Поиск по выпускам…"><button class="btn" id="offlineOnly">Офлайн</button><button class="btn" id="reload">Обновить</button></div>
<div id="status" class="status">Загрузка выпусков…</div><div id="list"></div>
</main>
<div class="player" id="player" hidden><div class="player-inner"><div class="title" id="pt">Радио-Т</div><div class="controls"><button class="btn" id="back">−30</button><button class="btn" id="play">▶</button><button class="btn" id="fwd">+30</button><input id="seek" type="range" min="0" max="1000" value="0"><select id="speed" class="speed"><option>0.8</option><option selected>1</option><option>1.2</option><option>1.5</option><option>1.75</option><option>2</option></select></div></div></div>
<audio id="audio"></audio>
<script>
const $=s=>document.querySelector(s), list=$("#list"), status=$("#status"), audio=$("#audio"), player=$("#player"), pt=$("#pt"), play=$("#play"), seek=$("#seek");
let current=null, allItems=[], offlineOnly=false, currentObjectUrl=null;
const MEDIA_CACHE="radio-t-media-v1";
let offlineIds=new Set(JSON.parse(localStorage.rtOfflineEpisodes||"[]"));
function persistOfflineIds(){localStorage.rtOfflineEpisodes=JSON.stringify([...offlineIds])}
function setOffline(e,value){const k=id(e);value?offlineIds.add(k):offlineIds.delete(k);persistOfflineIds()}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function id(e){return String(e.num||e.id||e.url||e.title)}
function progress(){try{return JSON.parse(localStorage.rtProgress||"{}")}catch{return {}}}
function save(){if(!current||!audio.duration)return;const p=progress();p[id(current)]={position:audio.currentTime,duration:audio.duration};localStorage.rtProgress=JSON.stringify(p)}
function date(v){try{return new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium"}).format(new Date(v))}catch{return ""}}
function plain(s){return String(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()}
function filterItems(){
  const q=$("#q").value.trim().toLowerCase();
  let items=!q?allItems:allItems.filter(e=>((e.title||"")+" "+plain(e.show_notes||e.body||e.description||"")).toLowerCase().includes(q));
  if(offlineOnly)items=items.filter(e=>offlineIds.has(id(e)));
  render(items);
  status.textContent=items.length?"":(offlineOnly?"Нет загруженных выпусков":"Ничего не найдено");
}
async function load(){
  status.className="status";
  status.textContent="Загрузка выпусков…";

  try{
    const local=await fetch("/episodes-fallback.json?t="+Date.now(),{cache:"no-store"});
    if(local.ok){
      allItems=await local.json();
      filterItems();
      status.textContent="";
    }
  }catch(e){ console.warn("fallback failed",e); }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),6000);
    const r=await fetch("/api/episodes?limit=70&t="+Date.now(),{cache:"no-store",signal:controller.signal});
    clearTimeout(timer);
    if(!r.ok)throw Error("HTTP "+r.status);
    const payload=await r.json();
    const data=Array.isArray(payload)?payload:(payload.items||[]);
    if(data.length){
      allItems=data;
      filterItems();
      status.textContent="";
      console.info("Radio-T source:",payload.source||"unknown");
    }
  }catch(e){
    console.warn("live API unavailable, using fallback",e);
    if(!allItems.length){
      status.className="status error";
      status.textContent="Не удалось загрузить выпуски";
    }
  }
}
async function downloadEpisode(e,button){
  const url=audioUrl(e);
  if(!url||!("caches" in window)){status.className="status error";status.textContent="Офлайн-хранилище недоступно в этом браузере";return}
  const old=button.textContent;
  button.disabled=true;
  button.textContent="Скачивание…";
  try{
    const cache=await caches.open(MEDIA_CACHE);
    let response;
    try{
      response=await fetch(url,{mode:"cors",cache:"no-store"});
      if(!response.ok)throw Error("HTTP "+response.status);
    }catch(corsError){
      response=await fetch(url,{mode:"no-cors",cache:"no-store"});
    }
    await cache.put(url,response.clone());
    setOffline(e,true);
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    status.className="status";
    status.textContent=(e.title||"Выпуск")+" сохранён для офлайн-прослушивания";
    filterItems();
  }catch(err){
    console.error(err);
    button.disabled=false;
    button.textContent=old;
    status.className="status error";
    status.textContent=err&&err.name==="QuotaExceededError"?"Не хватает места для выпуска":"Не удалось сохранить выпуск офлайн";
  }
}
async function removeOffline(e){
  try{
    const cache=await caches.open(MEDIA_CACHE);
    await cache.delete(audioUrl(e));
  }catch{}
  setOffline(e,false);
  filterItems();
  status.className="status";
  status.textContent="Офлайн-копия удалена";
}
function render(items){
  list.innerHTML=items.map(function(e,i){
    const saved=offlineIds.has(id(e));
    const offlineButtons=saved
      ?'<button class="btn download saved" disabled>✓ Загружен</button><button class="btn subtle" data-remove="'+i+'">Удалить</button>'
      :'<button class="btn download" data-download="'+i+'">⬇ Сохранить офлайн</button>';
    return '<article class="episode"><h2>'+esc(e.title||("Выпуск "+(e.num||"")))+'</h2><div class="meta">'+esc(date(e.date||e.pubDate))+'</div><div class="desc">'+esc(plain(e.show_notes||e.body||e.description||"").slice(0,340))+'</div><div class="actions"><button class="btn" data-i="'+i+'">▶ Слушать</button>'+offlineButtons+'</div></article>';
  }).join("");
  [...list.querySelectorAll("[data-i]")].forEach(function(b){b.onclick=function(){start(items[+b.dataset.i])}});
  [...list.querySelectorAll("[data-download]")].forEach(function(b){b.onclick=function(){downloadEpisode(items[+b.dataset.download],b)}});
  [...list.querySelectorAll("[data-remove]")].forEach(function(b){b.onclick=function(){removeOffline(items[+b.dataset.remove])}});
}
function audioUrl(e){
  const u=e.audio_url||e.audio||e.enclosure?.url||e.file||"";
  return String(u).replace(/^http:/,"https:");
}
async function start(e){
  const url=audioUrl(e);
  if(!url){status.className="status error";status.textContent="У выпуска не найден аудиофайл";return}
  save();
  current=e;
  player.hidden=false;
  pt.textContent=e.title||"Радио-Т";
  if(currentObjectUrl){URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null}
  let source=url;
  if(offlineIds.has(id(e))&&"caches" in window){
    try{
      const cached=await (await caches.open(MEDIA_CACHE)).match(url);
      if(cached){
        try{
          const blob=await cached.clone().blob();
          if(blob.size>0){currentObjectUrl=URL.createObjectURL(blob);source=currentObjectUrl}
        }catch{}
      }else{
        setOffline(e,false);
        filterItems();
      }
    }catch{}
  }
  audio.src=source;
  audio.onloadedmetadata=()=>{const p=progress()[id(e)];if(p&&p.position>10&&p.position<audio.duration-10)audio.currentTime=p.position};
  audio.play().catch(err=>{status.className="status error";status.textContent="Не удалось запустить аудио: "+err.message});
  if("mediaSession"in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:pt.textContent,artist:"Радио-Т"})}catch{}}
}
play.onclick=()=>audio.paused?audio.play():audio.pause();
$("#back").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-30);
$("#fwd").onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+30);
$("#speed").onchange=e=>audio.playbackRate=+e.target.value;
audio.ontimeupdate=()=>{if(audio.duration)seek.value=Math.round(audio.currentTime/audio.duration*1000)};
seek.oninput=()=>{if(audio.duration)audio.currentTime=+seek.value/1000*audio.duration};
audio.onplay=()=>play.textContent="Ⅱ";
audio.onpause=()=>{play.textContent="▶";save()};
setInterval(save,5000);
addEventListener("beforeunload",save);
$("#q").oninput=filterItems;
$("#reload").onclick=load;
$("#offlineOnly").onclick=()=>{
  offlineOnly=!offlineOnly;
  $("#offlineOnly").textContent=offlineOnly?"Все выпуски":"Офлайн";
  filterItems();
};
if("mediaSession"in navigator){
  for(const [a,f] of Object.entries({play:()=>audio.play(),pause:()=>audio.pause(),seekbackward:()=>audio.currentTime=Math.max(0,audio.currentTime-30),seekforward:()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+30)})){try{navigator.mediaSession.setActionHandler(a,f)}catch{}}
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(err=>console.warn("SW registration failed",err));
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
addEventListener("online",()=>{status.className="status";if(!status.textContent)status.textContent=""});
addEventListener("offline",()=>{status.className="status";status.textContent="Офлайн-режим"});
load();
</script>
</body></html>
